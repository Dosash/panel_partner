[project]
name = "panel-partner"
version = "1.1.0"
description = "Веб-панель для хранения партнёрских программ: что делают, условия выплат, реферальные ссылки и промокоды"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
