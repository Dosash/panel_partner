# Панель «Партнёрки» (один контейнер, без бота).
# Сеть хоста: панель слушает WEB_HOST:WEB_PORT прямо на сервере (по умолчанию 127.0.0.1:8097 —
# доступна только с самого сервера; наружу её обычно выводит nginx, см. README).
services:
  partner-panel:
    build: .
    image: partner-panel:latest
    container_name: partner-panel
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /app/data/partners.db
    volumes:
      - ./data:/app/data
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
